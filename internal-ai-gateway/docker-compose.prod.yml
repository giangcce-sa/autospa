services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8787
      TRUST_PROXY: "true"
    expose:
      - "8787"
    volumes:
      - gateway_data:/app/data
      - gateway_audit_logs:/app/audit-logs
      - gateway_kiro_workspaces:/app/kiro-workspaces
    depends_on:
      - nine-router
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nine-router:
    image: decolua/9router:latest
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      HOSTNAME: 0.0.0.0
      JWT_SECRET: ${NINEROUTER_JWT_SECRET:?NINEROUTER_JWT_SECRET is required}
      INITIAL_PASSWORD: ${NINEROUTER_INITIAL_PASSWORD:?NINEROUTER_INITIAL_PASSWORD is required}
      API_KEY_SECRET: ${NINEROUTER_API_KEY_SECRET:?NINEROUTER_API_KEY_SECRET is required}
      MACHINE_ID_SALT: ${NINEROUTER_MACHINE_ID_SALT:?NINEROUTER_MACHINE_ID_SALT is required}
      REQUIRE_API_KEY: ${NINEROUTER_REQUIRE_API_KEY:-true}
      AUTH_COOKIE_SECURE: ${NINEROUTER_AUTH_COOKIE_SECURE:-false}
    expose:
      - "20128"
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - nine_router_data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  gateway_data:
  gateway_audit_logs:
  gateway_kiro_workspaces:
  nine_router_data:
  caddy_data:
  caddy_config:
