services:
  migrate:
    image: ${AUTOSPA_MIGRATOR_IMAGE:-autospa-migrator:local}
    build:
      context: .
      target: migrator
    env_file:
      - .env
    restart: "no"

  autospa:
    image: ${AUTOSPA_IMAGE:-autospa:local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      AUTH_URL: "https://autospa.somail.us"
      NEXTAUTH_URL: "https://autospa.somail.us"
      NEXT_PUBLIC_APP_URL: "https://autospa.somail.us"
      AUTH_TRUST_HOST: "true"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - autospa_uploads:/app/public/uploads
      - autospa_media:/app/.data/media
    networks:
      - caddy

volumes:
  autospa_uploads:
    name: autospa_uploads
  autospa_media:
    name: autospa_media

networks:
  caddy:
    external: true
    name: internal-ai-gateway_default
